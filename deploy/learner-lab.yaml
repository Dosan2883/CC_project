AWSTemplateFormatVersion: '2010-09-09'
Description: Messenger HTTPS ALB and chat/worker ASGs using existing Learner Lab data services and instance profile.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different availability zones for ALB.
  InstanceSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets with outbound access to package repositories and AWS services.
  CertificateArn:
    Type: String
    Description: Existing ACM certificate ARN in this region.
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.small
  ReleaseBucket:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]*'
  ReleaseKey:
    Type: String
    Default: releases/messenger.zip
    AllowedPattern: '[A-Za-z0-9/_.-]+'
  EnvironmentParameterName:
    Type: String
    Description: Existing SSM SecureString containing the full dotenv configuration with RUN_MEDIA_WORKER=0.
    AllowedPattern: '/[A-Za-z0-9/_.-]+'
Resources:
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and HTTP redirect
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Messenger instances accessible only through ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '300'}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Name: !Ref InstanceProfileName}
        SecurityGroupIds: [!Ref InstanceSecurityGroup]
        MetadataOptions: {HttpTokens: required, InstanceMetadataTags: enabled}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eu
            dnf install -y python3.11 python3.11-pip unzip
            useradd --system --home-dir /opt/messenger messenger
            mkdir -p /opt/messenger /var/lib/messenger
            aws s3 cp s3://${ReleaseBucket}/${ReleaseKey} /tmp/messenger.zip --region ${AWS::Region}
            unzip -q /tmp/messenger.zip -d /opt/messenger
            python3.11 -m venv /opt/messenger/.venv
            /opt/messenger/.venv/bin/pip install -r /opt/messenger/requirements.txt
            umask 077
            aws ssm get-parameter --name '${EnvironmentParameterName}' --with-decryption --query Parameter.Value --output text --region ${AWS::Region} > /etc/messenger.env
            chown messenger:messenger /var/lib/messenger
            TOKEN=$(curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
            MODE=$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/tags/instance/ServiceMode)
            case "$MODE" in
              web) COMMAND='-m uvicorn main:app --host 0.0.0.0 --port 8000' ;;
              worker) COMMAND='-m app.media.worker' ;;
              *) exit 1 ;;
            esac
            cat > /etc/systemd/system/messenger.service <<EOF
            [Unit]
            Description=Messenger $MODE
            After=network-online.target
            Wants=network-online.target
            [Service]
            User=messenger
            WorkingDirectory=/opt/messenger
            EnvironmentFile=/etc/messenger.env
            Environment=RUN_MEDIA_WORKER=0
            ExecStart=/opt/messenger/.venv/bin/python $COMMAND
            Restart=always
            RestartSec=5
            TimeoutStopSec=30
            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable --now messenger
  ChatAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: HTTPSListener
    Properties:
      MinSize: '2'
      DesiredCapacity: '2'
      MaxSize: '3'
      VPCZoneIdentifier: !Ref InstanceSubnetIds
      LaunchTemplate: {LaunchTemplateId: !Ref LaunchTemplate, Version: !GetAtt LaunchTemplate.LatestVersionNumber}
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 600
      Tags: [{Key: ServiceMode, Value: web, PropagateAtLaunch: true}]
  ChatScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref ChatAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: {PredefinedMetricType: ASGAverageCPUUtilization}
  WorkerAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '1'
      DesiredCapacity: '1'
      MaxSize: '1'
      VPCZoneIdentifier: !Ref InstanceSubnetIds
      LaunchTemplate: {LaunchTemplateId: !Ref LaunchTemplate, Version: !GetAtt LaunchTemplate.LatestVersionNumber}
      HealthCheckType: EC2
      Tags: [{Key: ServiceMode, Value: worker, PropagateAtLaunch: true}]
Outputs:
  LoadBalancerDNS:
    Value: !GetAtt LoadBalancer.DNSName
  InstanceSecurityGroupId:
    Description: Permit this security group to connect to the existing Redis security group.
    Value: !Ref InstanceSecurityGroup
