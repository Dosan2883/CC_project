AWSTemplateFormatVersion: '2010-09-09'
Description: Messenger HTTPS ALB and chat/worker ASGs using existing Learner Lab data services and instance profile.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different availability zones for ALB.
  InstanceSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets with outbound access to package repositories and AWS services.
  CertificateArn:
    Type: String
    Description: Existing ACM certificate ARN in this region.
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.small
  ReleaseBucket:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]*'
  ReleaseKey:
    Type: String
    Default: releases/messenger.zip
    AllowedPattern: '[A-Za-z0-9/_.-]+'
  FFmpegArchiveKey:
    Type: String
    Default: ''
    AllowedPattern: '[A-Za-z0-9/_.-]*'
    Description: ZIP in ReleaseBucket containing executable Linux ffmpeg and ffprobe at its root.
  FFmpegArchiveSha256:
    Type: String
    Default: ''
    AllowedPattern: '([a-fA-F0-9]{64})?'
  EnvironmentParameterName:
    Type: String
    Description: Existing SSM SecureString containing the full dotenv configuration with RUN_MEDIA_WORKER=0.
    AllowedPattern: '/[A-Za-z0-9/_.-]+'
  EnableMonitoring:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
  MetricsNamespace:
    Type: String
    Default: Messenger
    AllowedPattern: '[A-Za-z][A-Za-z0-9_-]{0,63}'
  AIDailyCallLimit:
    Type: Number
    Default: 500
    MinValue: 0
  AIAllowPrivateRooms:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
  MediaDLQName:
    Type: String
    Default: ''
    AllowedPattern: '[A-Za-z0-9_.-]*'
  AIDLQName:
    Type: String
    Default: ''
    AllowedPattern: '[A-Za-z0-9_.-]*'
Rules:
  FFmpegArchiveRequiresChecksum:
    RuleCondition: !Not [!Equals [!Ref FFmpegArchiveKey, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref FFmpegArchiveSha256, '']]
        AssertDescription: Set FFmpegArchiveSha256 when supplying a worker ZIP.
Conditions:
  MonitoringEnabled: !Equals [!Ref EnableMonitoring, '1']
  HasMediaDLQ: !Not [!Equals [!Ref MediaDLQName, '']]
  HasAIDLQ: !Not [!Equals [!Ref AIDLQName, '']]
Resources:
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and HTTP redirect
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Messenger instances accessible only through ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '300'}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Name: !Ref InstanceProfileName}
        SecurityGroupIds: [!Ref InstanceSecurityGroup]
        MetadataOptions: {HttpTokens: required, InstanceMetadataTags: enabled}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eu
            dnf install -y python3.11 python3.11-pip unzip
            useradd --system --home-dir /opt/messenger messenger
            mkdir -p /opt/messenger /var/lib/messenger
            aws s3 cp s3://${ReleaseBucket}/${ReleaseKey} /tmp/messenger.zip --region ${AWS::Region}
            unzip -q /tmp/messenger.zip -d /opt/messenger
            python3.11 -m venv /opt/messenger/.venv
            /opt/messenger/.venv/bin/pip install -r /opt/messenger/requirements.txt
            (
              umask 077
              aws ssm get-parameter --name '${EnvironmentParameterName}' --with-decryption --query Parameter.Value --output text --region ${AWS::Region} > /etc/messenger.env
              printf '%s\n' '' 'CLOUDWATCH_METRICS=${EnableMonitoring}' 'CLOUDWATCH_NAMESPACE=${MetricsNamespace}' 'AI_DAILY_CALL_LIMIT=${AIDailyCallLimit}' 'AI_ALLOW_PRIVATE_ROOMS=${AIAllowPrivateRooms}' >> /etc/messenger.env
            )
            chown messenger:messenger /var/lib/messenger
            TOKEN=$(curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
            MODE=$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/tags/instance/ServiceMode)
            PRECHECK=''
            case "$MODE" in
              web) COMMAND='-m uvicorn main:app --host 0.0.0.0 --port 8000' ;;
              worker)
                dnf install -y libgomp mesa-libGL glib2
                if [ -n '${FFmpegArchiveKey}' ]; then
                  FFMPEG_DIR=$(mktemp -d)
                  aws s3 cp 's3://${ReleaseBucket}/${FFmpegArchiveKey}' "$FFMPEG_DIR/ffmpeg.zip" --region ${AWS::Region}
                  printf '%s  %s\n' '${FFmpegArchiveSha256}' "$FFMPEG_DIR/ffmpeg.zip" | sha256sum -c -
                  unzip -q "$FFMPEG_DIR/ffmpeg.zip" ffmpeg ffprobe -d "$FFMPEG_DIR"
                  install -m 0755 "$FFMPEG_DIR/ffmpeg" "$FFMPEG_DIR/ffprobe" /usr/local/bin/
                  rm -f "$FFMPEG_DIR/ffmpeg.zip" "$FFMPEG_DIR/ffmpeg" "$FFMPEG_DIR/ffprobe"
                  rmdir "$FFMPEG_DIR"
                elif ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
                  dnf install -y ffmpeg || dnf install -y ffmpeg-free
                fi
                /opt/messenger/.venv/bin/pip install -r /opt/messenger/requirements-ocr.txt -r /opt/messenger/requirements-stt.txt
                if ! grep -Eq '^[[:space:]]*STT_BACKEND=[[:space:]]*[^[:space:]]' /etc/messenger.env; then
                  printf '%s\n' 'STT_BACKEND=whisper' >> /etc/messenger.env
                fi
                runuser -u messenger -- env HOME=/var/lib/messenger PADDLE_PDX_CACHE_HOME=/var/lib/messenger/paddlex PADDLE_HOME=/var/lib/messenger/paddle /opt/messenger/.venv/bin/python /opt/messenger/scripts/prepare_ocr.py
                systemd-run --wait --pipe --collect --uid=messenger --property=EnvironmentFile=/etc/messenger.env --setenv=HOME=/var/lib/messenger /opt/messenger/.venv/bin/python /opt/messenger/scripts/prepare_stt.py
                PRECHECK='ExecStartPre=/opt/messenger/.venv/bin/python /opt/messenger/scripts/prepare_ocr.py --check'
                COMMAND='-m app.media.worker' ;;
              *) exit 1 ;;
            esac
            cat > /etc/systemd/system/messenger.service <<EOF
            [Unit]
            Description=Messenger $MODE
            After=network-online.target
            Wants=network-online.target
            [Service]
            User=messenger
            WorkingDirectory=/opt/messenger
            EnvironmentFile=/etc/messenger.env
            Environment=RUN_MEDIA_WORKER=0
            Environment=HOME=/var/lib/messenger
            Environment=PADDLE_PDX_CACHE_HOME=/var/lib/messenger/paddlex
            Environment=PADDLE_HOME=/var/lib/messenger/paddle
            $PRECHECK
            ExecStart=/opt/messenger/.venv/bin/python $COMMAND
            Restart=always
            RestartSec=5
            TimeoutStopSec=30
            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable --now messenger
  ChatAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: HTTPSListener
    Properties:
      MinSize: '2'
      DesiredCapacity: '2'
      MaxSize: '3'
      VPCZoneIdentifier: !Ref InstanceSubnetIds
      LaunchTemplate: {LaunchTemplateId: !Ref LaunchTemplate, Version: !GetAtt LaunchTemplate.LatestVersionNumber}
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 600
      Tags: [{Key: ServiceMode, Value: web, PropagateAtLaunch: true}]
  ChatScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref ChatAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: {PredefinedMetricType: ASGAverageCPUUtilization}
  WorkerAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '1'
      DesiredCapacity: '1'
      MaxSize: '1'
      VPCZoneIdentifier: !Ref InstanceSubnetIds
      LaunchTemplate: {LaunchTemplateId: !Ref LaunchTemplate, Version: !GetAtt LaunchTemplate.LatestVersionNumber}
      HealthCheckType: EC2
      Tags: [{Key: ServiceMode, Value: worker, PropagateAtLaunch: true}]
  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: MonitoringEnabled
    Properties:
      DashboardName: !Sub '${AWS::StackName}-messenger'
      DashboardBody:
        Fn::Sub:
          - |
            {"widgets":[
              {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Healthy chat hosts and WebSocket connections","region":"${AWS::Region}","period":60,"metrics":[
                ["AWS/ApplicationELB","HealthyHostCount","TargetGroup","${TargetGroup.TargetGroupFullName}","LoadBalancer","${LoadBalancer.LoadBalancerFullName}",{"stat":"Minimum"}],
                ["${MetricsNamespace}","WebSocketConnections",{"stat":"Sum","yAxis":"right"}]]}},
              {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Message delivery P95 (ms)","region":"${AWS::Region}","period":60,"stat":"p95","metrics":[
                ["${MetricsNamespace}","MessageDeliveryMs"]]}},
              {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"CPU and memory (%)","region":"${AWS::Region}","period":300,"stat":"Average","metrics":[
                ["AWS/EC2","CPUUtilization","AutoScalingGroupName","${ChatAutoScalingGroup}"],
                ["AWS/EC2","CPUUtilization","AutoScalingGroupName","${WorkerAutoScalingGroup}"],
                ["${MetricsNamespace}","MemoryUsedPercent","Role","Web"],["${MetricsNamespace}","MemoryUsedPercent","Role","Worker"]]}},
              {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Pending work and dead letters","region":"${AWS::Region}","period":60,"metrics":[
                ["${MetricsNamespace}","PendingJobs","Queue","Media",{"stat":"Maximum"}],
                ["${MetricsNamespace}","PendingJobs","Queue","AI",{"stat":"Maximum"}],
                ["${MetricsNamespace}","JobDeadLetters","Queue","Media",{"stat":"Sum"}],
                ["${MetricsNamespace}","JobDeadLetters","Queue","AI",{"stat":"Sum"}]${MediaDLQMetric}${AIDLQMetric}]}},
              {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"OCR and STT P95 by language (ms)","region":"${AWS::Region}","period":300,"metrics":[
                [{"expression":"SEARCH('{\"${MetricsNamespace}\",Kind,Language} MetricName=\"ExtractionMs\"', 'p95')","id":"e1"}]]}},
              {"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"AI failures and rate limiting (%)","region":"${AWS::Region}","period":300,"stat":"Sum","metrics":[
                ["${MetricsNamespace}","AIUpstreamCalls",{"id":"calls","visible":false}],
                ["${MetricsNamespace}","AIUpstreamFailures",{"id":"fail","visible":false}],
                ["${MetricsNamespace}","AIUpstreamRateLimited",{"id":"throttle","visible":false}],
                ["${MetricsNamespace}","AIHTTPRequests",{"id":"req","visible":false}],
                ["${MetricsNamespace}","AIHTTPFailures",{"id":"httpfail","visible":false}],
                ["${MetricsNamespace}","AIHTTPRateLimited",{"id":"local429","visible":false}],
                [{"expression":"IF(calls>0,100*fail/calls,0)","label":"Upstream failures","id":"e1"}],
                [{"expression":"IF(calls>0,100*throttle/calls,0)","label":"Upstream 429","id":"e2"}],
                [{"expression":"IF(req>0,100*local429/req,0)","label":"HTTP 429","id":"e3"}],
                [{"expression":"IF(req>0,100*httpfail/req,0)","label":"HTTP failures","id":"e4"}]]}},
              {"type":"metric","x":0,"y":18,"width":12,"height":6,"properties":{"title":"Retry success per attempt (%)","region":"${AWS::Region}","period":300,"stat":"Sum","metrics":[
                ["${MetricsNamespace}","RetryAttempts","Queue","Media",{"id":"ma","visible":false}],
                ["${MetricsNamespace}","RetrySuccesses","Queue","Media",{"id":"ms","visible":false}],
                ["${MetricsNamespace}","RetryAttempts","Queue","AI",{"id":"aa","visible":false}],
                ["${MetricsNamespace}","RetrySuccesses","Queue","AI",{"id":"ais","visible":false}],
                [{"expression":"IF(ma>0,100*ms/ma,0)","label":"Media","id":"e1"}],
                [{"expression":"IF(aa>0,100*ais/aa,0)","label":"AI","id":"e2"}]]}}
            ]}
          - MediaDLQMetric: !If
              - HasMediaDLQ
              - !Sub ',["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${MediaDLQName}",{"stat":"Maximum"}]'
              - ''
            AIDLQMetric: !If
              - HasAIDLQ
              - !Sub ',["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${AIDLQName}",{"stat":"Maximum"}]'
              - ''
Outputs:
  LoadBalancerDNS:
    Value: !GetAtt LoadBalancer.DNSName
  InstanceSecurityGroupId:
    Description: Permit this security group to connect to the existing Redis security group.
    Value: !Ref InstanceSecurityGroup
