AWSTemplateFormatVersion: '2010-09-09'
Description: SQS AI to Lambda with DLQ and durable job recovery
Parameters:
  RoleArn:
    Type: String
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  TableName:
    Type: String
  MediaBucket:
    Type: String
  MediaQueueUrl:
    Type: String
  RedisUrl:
    Type: String
  AuthSecretParameterName:
    Type: String
    Description: SSM SecureString parameter name for the shared signing key.
    MinLength: 1
  TranslateUrl:
    Type: String
  TranslateSecretParameterName:
    Type: String
    Description: SSM SecureString parameter name for the translation API secret.
    MinLength: 1
  LambdaSubnetIds:
    Type: String
    Default: ''
    AllowedPattern: '(subnet-([0-9a-f]{8}|[0-9a-f]{17})(,subnet-([0-9a-f]{8}|[0-9a-f]{17}))*)?'
  LambdaSecurityGroupIds:
    Type: String
    Default: ''
    AllowedPattern: '(sg-([0-9a-f]{8}|[0-9a-f]{17})(,sg-([0-9a-f]{8}|[0-9a-f]{17}))*)?'
  EnableMonitoring:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
  MetricsNamespace:
    Type: String
    Default: Messenger
    AllowedPattern: '[A-Za-z][A-Za-z0-9_-]{0,63}'
  AIDailyCallLimit:
    Type: Number
    Default: 500
    MinValue: 0
  AIAllowPrivateRooms:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
Rules:
  VpcParametersTogether:
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref LambdaSubnetIds, ''], !Equals [!Ref LambdaSecurityGroupIds, '']]
          - !And [!Not [!Equals [!Ref LambdaSubnetIds, '']], !Not [!Equals [!Ref LambdaSecurityGroupIds, '']]]
        AssertDescription: Supply both Lambda subnet and security group lists or leave both empty.
Conditions:
  AttachWorkerVpc: !And [!Not [!Equals [!Ref LambdaSubnetIds, '']], !Not [!Equals [!Ref LambdaSecurityGroupIds, '']]]
Resources:
  DeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
  Queue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 5400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetters.Arn
        maxReceiveCount: 5
  Worker:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: handler.handler
      Role: !Ref RoleArn
      Timeout: 900
      MemorySize: 512
      VpcConfig: !If
        - AttachWorkerVpc
        - SubnetIds: !Split [',', !Ref LambdaSubnetIds]
          SecurityGroupIds: !Split [',', !Ref LambdaSecurityGroupIds]
        - !Ref AWS::NoValue
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          DATA_BACKEND: dynamodb
          DYNAMODB_TABLE: !Ref TableName
          S3_BUCKET: !Ref MediaBucket
          MEDIA_QUEUE_URL: !Ref MediaQueueUrl
          AI_QUEUE_URL: !Ref Queue
          REDIS_URL: !Ref RedisUrl
          AUTH_SECRET_PARAMETER: !Ref AuthSecretParameterName
          TRANSLATE_URL: !Ref TranslateUrl
          TRANSLATE_SECRET_PARAMETER: !Ref TranslateSecretParameterName
          RUN_MEDIA_WORKER: '0'
          CLOUDWATCH_METRICS: !Ref EnableMonitoring
          CLOUDWATCH_NAMESPACE: !Ref MetricsNamespace
          AI_DAILY_CALL_LIMIT: !Sub '${AIDailyCallLimit}'
          AI_ALLOW_PRIVATE_ROOMS: !Ref AIAllowPrivateRooms
  Mapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt Queue.Arn
      FunctionName: !Ref Worker
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
  Recovery:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      Targets:
        - Arn: !GetAtt Worker.Arn
          Id: Recovery
  RecoveryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Worker
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Recovery.Arn
Outputs:
  AIQueueUrl:
    Value: !Ref Queue
  AIDLQUrl:
    Value: !Ref DeadLetters
  AIDLQName:
    Value: !GetAtt DeadLetters.QueueName
